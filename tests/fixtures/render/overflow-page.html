<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1123px; height: 794px; margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    article { width: 1123px; height: 794px; padding: 48px; background: #fff; color: #17251c; }
    .card { width: 400px; height: 70px; overflow: hidden; font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body><article data-slide-page="1"><div id="overflow-target" class="card">这是一个故意超出固定高度的长段落。它包含多行中文内容，用于验证浏览器测量能识别 scrollHeight 大于 clientHeight 的真实溢出，而不是依赖字符串长度猜测。建立固定对接窗口、动态调配机制和有序变更流程，确保项目要求得到清晰、稳定且可追溯的落实。</div></article></body>
</html>
